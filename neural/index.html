<!DOCTYPE html>
<html lang="en">
<head>

  <title>neural thing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="aiVisBtn">AI</button>

      <div id="aiParams"></div>
    </div>
  </div>
