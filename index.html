<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Embed</title>
    <style>
        /* Optional: Makes the iframe fill the entire screen */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .embed-container {
            width: 100%;
            height: 100vh; /* 100% of the viewport height */
            border: none;
        }
    </style>
</head>
<body>

    <!-- The iframe element used for embedding -->
    <iframe src="https://blockte.on.websim.com/" class="embed-container" title="Blockte Embed"></iframe>

</body>
</html>
